<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}AminFokir — Premium Prompts & Market Insights{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Curated prompts, trading strategies, and market intelligence. Free PDF downloads.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- ═══════════════════════════════════════════════════════
       ADSTERRA ADS — PASTE YOUR SCRIPT TAGS BELOW THIS LINE
       ═══════════════════════════════════════════════════════ -->
  <!-- ADSTERRA_HEAD_SCRIPT_START -->

  <!-- ADSTERRA_HEAD_SCRIPT_END -->
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────── -->
<header class="nav-wrap">
  <nav class="nav">
    <a href="/" class="logo">Amin<span>Fokir</span></a>
    <div class="nav-links">
      <a href="/">All</a>
      {% for cat in categories %}
      <a href="/category/{{ cat }}" class="{% if active_cat is defined and active_cat == cat %}active{% endif %}">{{ cat }}</a>
      {% endfor %}
    </div>
    <div class="nav-badge">Free PDFs</div>
  </nav>
</header>

<!-- ── ADSTERRA BANNER TOP — PASTE LEADERBOARD/BANNER AD HERE ── -->
<div class="ad-slot ad-top" id="adsterra-top">
  <!-- ADSTERRA_BANNER_TOP_START -->

  <!-- ADSTERRA_BANNER_TOP_END -->
</div>

<!-- ── MAIN ────────────────────────────────────────────── -->
<main>
  {% block content %}{% endblock %}
</main>

<!-- ── ADSTERRA BANNER BOTTOM ──────────────────────────── -->
<div class="ad-slot ad-bottom" id="adsterra-bottom">
  <!-- ADSTERRA_BANNER_BOTTOM_START -->

  <!-- ADSTERRA_BANNER_BOTTOM_END -->
</div>

<!-- ── FOOTER ──────────────────────────────────────────── -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="logo">Amin<span>Fokir</span></span>
      <p>Curated intelligence for builders, traders &amp; creators.</p>
    </div>
    <div class="footer-links">
      <a href="/">Home</a>
      {% for cat in categories %}
      <a href="/category/{{ cat }}">{{ cat }}</a>
      {% endfor %}
    </div>
    <p class="footer-copy">© 2026 AminFokir. All rights reserved.</p>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
